name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLA:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'I have read the CLA document and I hereby agree to its terms.' ||
             github.event_name == 'pull_request_target')
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ASSISTANT_PAT }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'https://github.com/AndorinaAI/Andorina-WhatsApp-Agent-for-Hermes/blob/dev/CLA.md'
          branch: 'dev'
          allowlist: 'AndorinaAI,bot*'
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: |
            ## ⚠️ Contributor License Agreement Required

            Hi @${{ github.actor }}, thanks for your contribution! 🙏

            Before your pull request can be merged, you must **read and accept the Contributor License Agreement (CLA)**.

            📄 **[Read the CLA here](https://github.com/AndorinaAI/Andorina-WhatsApp-Agent-for-Hermes/blob/dev/CLA.md)**

            The CLA transfers the intellectual property rights of your contribution to the project owner. This is required for the dual-licensing model (AGPL-3.0 / Commercial).

            **To accept, reply to this PR with exactly:**
            ```
            I have read the CLA document and I hereby agree to its terms.
            ```

            For commercial licensing inquiries: andorinacoding@gmail.com
          custom-pr-sign-comment: 'I have read the CLA document and I hereby agree to its terms.'
          custom-allsigned-prcomment: '✅ All contributors have accepted the CLA. This PR is ready for review.'
